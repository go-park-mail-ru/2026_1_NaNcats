serviceName: cart-service
image:
  repository: ghcr.io/go-park-mail-ru/2026_1_nancats/cart
service:
  port: 50055
env:
  CONFIG_PATH: "./services/cart/config.yaml"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service-rabbitmq:5672/"
  RESTAURANT_SERVICE_ADDR: "restaurant-service:50053"
  DATABASE_URL: "postgres://db_user:$(DB_PASSWORD)@postgres-service-postgresql:5432/cart_db?sslmode=disable"
secrets:
  DB_PASSWORD:
    secretName: nancats-prod-secrets
    secretKey: db-password
