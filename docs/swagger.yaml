  /restaurants:
    get:
      consumes:
      - application/json
      description: Возвращает список всех брендов ресторанов с поддержкой пагинации
      parameters:
      - description: Количество возвращаемых элементов (по умолчанию 20)
        in: query
        name: limit
        type: integer
      - description: Смещение для пагинации (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка ресторанов
          schema:
            $ref: '#/definitions/restaurant.RestaurantBrandsResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение списка ресторанов
      tags:
      - restaurants
  /restaurants/{id}:
    get:
      consumes:
      - application/json
      description: Возвращает детальную информацию о бренде ресторана по его уникальному
        идентификатору
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение ресторана
          schema:
            $ref: '#/definitions/restaurant.RestaurantBrandResponse'
        "400":
          description: Неверный формат ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Ресторан не найден
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение ресторана по ID
      tags:
      - restaurants
  /restaurants/{id}/dishes:
    get:
      consumes:
      - application/json
      description: Возвращает список блюд для конкретного ресторана с возможностью
        пагинации и поиска по названию
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      - description: Количество возвращаемых элементов (по умолчанию 20)
        in: query
        name: limit
        type: integer
      - description: Смещение для пагинации (по умолчанию 0)
        in: query
        name: offset
        type: integer
      - description: Поисковый запрос для фильтрации блюд
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка блюд
