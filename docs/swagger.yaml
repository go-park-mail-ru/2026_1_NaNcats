            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение списка адресов
      tags:
      - profile
    post:
      consumes:
      - application/json
      description: Создает новую запись адреса для текущего пользователя
      parameters:
      - description: Данные адреса
        in: body
        name: input
        required: true
