      - description: ID ресторана
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение отзывов
          schema:
            $ref: '#/definitions/review.ReviewsResponse'
        "400":
          description: Неверный ID ресторана
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение списка отзывов
      tags:
      - review
    post:
      consumes:
      - application/json
      description: Создает новый отзыв для указанного ресторана с оценкой и комментарием
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для создания отзыва
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/review.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Отзыв успешно создан
          schema:
            $ref: '#/definitions/review.Review'
        "400":
          description: Неверный формат JSON, ID ресторана или ошибка валидации полей
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Создание отзыва
      tags:
      - review
  /search:
    get:
      consumes:
      - application/json
      description: Осуществляет поиск по ресторанам и блюдам на основе переданного
        ключевого слова
      parameters:
      - description: Поисковый запрос
        in: query
        name: q
        required: true
        type: string
      - description: Количество возвращаемых элементов (по умолчанию 20)
        in: query
        name: limit
        type: integer
      - description: Смещение для пагинации (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный поиск (возвращает списки ресторанов и блюд)
