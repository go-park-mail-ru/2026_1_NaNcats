            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение профиля пользователя
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Частично обновляет данные профиля текущего пользователя (имя и/или
