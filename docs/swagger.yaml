      - support
  /support/tickets:
    get:
      description: Возвращает все обращения текущего пользователя (идентифицируется
        по токену или куке guest_id)
      produces:
      - application/json
      responses:
        "200":
          description: Список тикетов пользователя
          schema:
            items:
              $ref: '#/definitions/support.TicketDTO'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение списка тикетов пользователя
      tags:
      - support
    post:
      consumes:
      - application/json
      description: Создает новое обращение в службу поддержки (для авторизованных
        и неавторизованных пользователей)
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
