host: localhost:8080
info:
  contact: {}
  description: API бэкенда для проекта "Delivery Club" от команды NaNcats
  title: NaNcats Delivery API
  version: "1.0"
paths:
  /admin/users/role:
    post:
      consumes:
      - application/json
      parameters:
      - description: Ключ
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_user.UpdateRoleRequest'
      produces:
      - application/json
      responses: {}
      summary: Смена роли пользователя (админ)
      tags:
      - admin
  /api/cart:
    delete:
      consumes:
      - application/json
      description: Удаляет все товары из указанной корзины. В Shared-режиме доступно
        только админу.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.BasicCartOperationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Корзина очищена
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав на выполнение операции
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Очистить корзину
      tags:
      - cart
    get:
      description: Возвращает текущую корзину авторизованного пользователя (включая
        статус комнаты и участников)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_cart.CartResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить корзину
      tags:
      - cart
  /api/cart/close:
    post:
      consumes:
      - application/json
      description: Переводит корзину в Solo-режим. Удаляет всех участников кроме админа
        и удаляет их блюда.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: ID корзины
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.BasicCartOperationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Корзина переведена в соло-режим
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Только админ может закрыть корзину
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Закрыть совместную корзину
      tags:
      - cart
  /api/cart/invite:
    post:
      description: Создает токен-приглашение в корзину. Переводит корзину в режим
        'shared'. Доступно только админу.
      parameters:
      - description: ID корзины
        in: query
        name: cart_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_cart.InviteResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Только админ может генерировать ссылки
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Сгенерировать инвайт-ссылку
      tags:
      - cart
  /api/cart/items:
    delete:
      consumes:
      - application/json
      description: Удаляет позицию из корзины. Гость может удалять только свое, админ
        - любое.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные для удаления
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.RemoveItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Товар удален
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав на удаление этой позиции
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить товар
      tags:
      - cart
    post:
      consumes:
      - application/json
      description: Добавляет товар в корзину. Вызывающий пользователь становится владельцем
        (owner) товара.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные товара
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.AddItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Товар добавлен
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверное количество или блюдо из другого ресторана
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Пользователь не состоит в этой корзине
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Добавить товар
      tags:
      - cart
    put:
      consumes:
      - application/json
      description: Изменяет количество существующего товара. Гость может менять только
        свои позиции, админ - любые.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные обновления
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.UpdateQuantityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Количество обновлено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос или количество
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав на изменение этой позиции
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить количество товара
      tags:
      - cart
  /api/cart/items/owner:
    patch:
      consumes:
      - application/json
      description: Переназначает блюдо на другого участника комнаты (или делает позицию
        ничейной, передав null). Только для админа.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Новый владелец
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.ReassignOwnerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Владелец изменен
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Только админ может переназначать
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить плательщика товара
      tags:
      - cart
  /api/cart/join:
    post:
      consumes:
      - application/json
      description: Добавляет пользователя в совместную корзину по токену инвайта.
      parameters:
      - description: Токен приглашения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.JoinCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход (возвращает cart_id)
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Инвайт недействителен или протух
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Присоединиться к корзине
      tags:
      - cart
  /api/cart/members:
    delete:
      consumes:
      - application/json
      description: Кикает гостя из комнаты. Блюда гостя становятся 'ничейными' (owner_user_id
        = null).
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Кого удаляем
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_cart.KickMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Участник удален
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Только админ может удалять участников
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить участника
      tags:
      - cart
  /api/orders:
    post:
      consumes:
      - application/json
      description: Создает заказ на основе корзины, рассчитывает долги (Splits) и
        запускает Сагу
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные для оформления
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Заказ успешно создан (ссылки на оплату придут по WS)
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_order.CreateOrderResponse'
        "400":
          description: Bad request, пустая корзина или есть ничейные блюда
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Указанный адрес не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Создать заказ
      tags:
      - order
  /api/orders/splits/{id}/pay:
    post:
      consumes:
      - application/json
      description: Перехватывает чужой счет (Сплит) и запускает по нему транзакцию
        оплаты
      parameters:
      - description: UUID сплита (счета)
        in: path
        name: id
        required: true
        type: string
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные для оплаты
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_order.PayForFriendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Процесс оплаты запущен
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Оплатить за друга
      tags:
      - order
  /api/profile/orders:
    get:
      description: Возвращает историю заказов пользователя со всеми позициями и детализацией
        счетов (Splits)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api-gateway_internal_delivery_http_order.OrderHistoryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить историю заказов
      tags:
      - order
  /api/ws/cart:
    get:
      description: Устанавливает WS соединение для получения live-обновлений совместной
        корзины
      parameters:
      - description: ID корзины
        in: query
        name: cart_id
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Bad Request (отсутствует cart_id)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: WebSocket соединение корзины
      tags:
      - cart
  /api/ws/orders/{id}:
    get:
      description: Подключение для получения live-обновлений по заказу и ссылок на
        оплату
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: WebSocket отслеживания заказа
      tags:
      - order
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет учетные данные и устанавливает сессионную куку
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_auth.LoginResponse'
        "400":
          description: Неверный формат JSON
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
        "401":
          description: Неверный логин или пароль
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
      summary: Авторизация пользователя
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Удаляет информацию о текущей сессии и принудительно протухает куку
        с сессией
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход
      summary: Выход из текущей
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Возвращает данные профиля пользователя, если сессионная кука валидна
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход и создание сессии
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_auth.LoginResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
      summary: Проверка текущей сессии
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Проверяет данные, создает нового пользователя и устанавливает сессионную
        куку
      parameters:
      - description: Данные для регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_delivery_http_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешная регистрация
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_auth.RegisterResponse'
        "400":
          description: Ошибка валидации (email/пароль)
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
        "409":
          description: Пользователь с такой почтой уже существует
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /categories:
    get:
      description: Возвращает актуальный список доступных категорий кухни с их идентификаторами
        и эмодзи из БД
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка категорий
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_restaurant.CategoriesResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
      summary: Получение списка категорий
      tags:
      - categories
  /categories/{slug}/restaurants:
    get:
      description: Возвращает список брендов ресторанов, отфильтрованный по переданному
        названию категории
      parameters:
      - description: Название (или слаг) категории
        in: path
        name: slug
        required: true
        type: string
      - description: Количество возвращаемых элементов (по умолчанию 20)
        in: query
        name: limit
        type: integer
      - description: Смещение для пагинации (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение ресторанов по категории
          schema:
            $ref: '#/definitions/api-gateway_internal_delivery_http_restaurant.RestaurantBrandsResponse'
        "400":
          description: Отсутствует идентификатор категории
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_shared_pkg_response.ErrorResponse'
      summary: Получение ресторанов по категории
      tags:
      - categories
  /csrf:
    get:
      description: Возвращает текущий CSRF токен пользователя на основе его сессии.
