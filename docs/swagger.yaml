      - profile
    post:
      consumes:
      - multipart/form-data
      description: Загружает и обновляет аватар текущего авторизованного пользователя.
        Принимает multipart/form-data with полем 'avatar'.
      parameters:
      - description: Файл аватара (WEBP/JPG/JPEG/PNG, до 5МБ)
