host: localhost:8080
info:
  contact: {}
  description: API бэкенда для проекта "Delivery Club" от команды NaNcats
  title: NaNcats Delivery API
  version: "1.0"
paths:
  /admin/support/stats:
    get:
      description: 'Возвращает агрегированные данные по тикетам: общее количество,
        распределение по статусам и категориям, средний рейтинг и среднее время решения.
        Доступно только для ролей admin и support.'
      produces:
      - application/json
      responses:
        "200":
          description: Статистика успешно получена
          schema:
            $ref: '#/definitions/supportclient.SupportStats'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Недостаточно прав (требуется роль admin или support)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Получение статистики техподдержки
      tags:
      - admin
      - support
  /admin/users/role:
    post:
      consumes:
      - application/json
      parameters:
      - description: Ключ
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/user.UpdateRoleRequest'
      produces:
      - application/json
      responses: {}
      summary: Смена роли пользователя (админ)
      tags:
      - admin
  /agent/status:
    patch:
      consumes:
      - application/json
      description: 'Позволяет агенту изменить свой статус (например: активен, отошел)'
      parameters:
      - description: Новый статус агента
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_api-gateway_internal_delivery_http_support.SetAgentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Статус успешно обновлен
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_api-gateway_internal_delivery_http_support.SuccessResponse'
        "400":
          description: Ошибка запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Установка рабочего статуса агента
      tags:
      - agent
  /agent/templates:
    get:
      description: Возвращает список готовых шаблонов(отбивок) для использования агентами
        в чате
      produces:
      - application/json
      responses:
        "200":
          description: Список шаблонов
          schema:
            items:
              $ref: '#/definitions/support.TemplateDTO'
            type: array
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Получение шаблонов ответов (Для агентов)
      tags:
      - agent
  /agent/tickets:
    get:
      description: Возвращает список тикетов, назначенных на текущего агента поддержки
      produces:
      - application/json
      responses:
        "200":
          description: Список назначенных тикетов
          schema:
            items:
              $ref: '#/definitions/support.TicketDTO'
            type: array
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получение назначенных тикетов (Для агентов)
      tags:
      - agent
  /agent/tickets/{id}/reassign:
    post:
      consumes:
      - application/json
      description: Передает тикет другому агенту или на другую линию поддержки
      parameters:
      - description: Public ID тикета
        in: path
        name: id
        required: true
        type: string
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные для переназначения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_api-gateway_internal_delivery_http_support.ReassignTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Тикет успешно переназначен
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_api-gateway_internal_delivery_http_support.SuccessResponse'
        "400":
          description: Ошибка запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Переназначение тикета (Для агентов)
      tags:
      - agent
  /agent/tickets/{id}/status:
    patch:
      consumes:
      - application/json
      description: Меняет статус указанного тикета
      parameters:
      - description: Public ID тикета
        in: path
        name: id
        required: true
        type: string
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Новый статус
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/support.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Статус успешно изменен
          schema:
            $ref: '#/definitions/github_com_go-park-mail-ru_2026_1_NaNcats_api-gateway_internal_delivery_http_support.SuccessResponse'
        "400":
          description: Ошибка запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Изменение статуса тикета (Для агентов)
      tags:
      - agent
  /api/cart:
    delete:
      consumes:
      - application/json
      description: Удаляет все товары из указанной корзины. В Shared-режиме доступно
        только админу.
      parameters:
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/cart.BasicCartOperationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Корзина очищена
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный формат запроса
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав на выполнение операции
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Очистить корзину
      tags:
      - cart
    get:
      description: Возвращает текущую корзину авторизованного пользователя (включая
        статус комнаты и участников)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart.CartResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить корзину
      tags:
      - cart
  /api/cart/close:
    post:
      consumes:
      - application/json
