syntax = "proto3";

package auth;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/auth";

// Сервис авторизации
service AuthService {
  // Метод для выдачи сессии
  rpc IssueSession (IssueSessionRequest) returns (AuthResponse);
  // Метод для входа в аккаунт
  rpc Login (LoginRequest) returns (AuthResponse);
  // Метод для выхода из аккаунты
  rpc Logout (LogoutRequest) returns (google.protobuf.Empty);
  // Метод для проверки сессии
  rpc CheckSession (CheckSessionRequest) returns (CheckSessionResponse);
  // Метод для получения CSRF токена
  rpc GetCSRF (CSRFRequest) returns (CSRFResponse);
  // Метод для создания CSRF токена
  rpc SetCSRF (CSRFRequest) returns (CSRFResponse);
}

message Session {
  string id = 1;
  int64 user_id = 2;
  string user_agent = 3;
  string role = 4;
  google.protobuf.Timestamp expires_at = 5;
}


message IssueSessionRequest {
  int64 user_id = 1;
  string role = 2;
  string user_agent = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
}

message AuthResponse {
  Session session = 1;
}

message LogoutRequest {
  string session_id = 1;
}

message CheckSessionRequest {
  string session_id = 1;
}

message CheckSessionResponse {
  int64 user_id = 1;
  string role = 2; 
}

message CSRFRequest {
  string session_id = 1;
}

message CSRFResponse {
  string token = 1;
}
