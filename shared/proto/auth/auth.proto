syntax = "proto3";

package auth;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/auth";

// Сервис авторизации
service AuthService {
  // Метод для регистрации
  rpc Register (RegisterRequest) returns (AuthResponse);
  // Метод для входа в аккаунт
  rpc Login (RegisterRequest) returns (AuthResponse);
  // Метод для выхода из аккаунты
  rpc Logout (RegisterRequest) returns (google.protobuf.Empty);
  // Метод для проверки сессии
  rpc CheckSession (CheckSessionRequest) returns (google.protobuf.Empty);
  // Метод для получения CSRF токена
  rpc GetCSRF (CSRFRequest) returns (CSRFResponse);
  // Метод для создания CSRF токена
  rpc SetCSRF (CSRFRequest) returns (CSRFResponse);
}

message Session {
  string id = 1;
  int64 user_id = 2;
  string user_agent = 3;
  google.protobuf.Timestamp expires_at = 4;
}


message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string user_agent = 4;
  string idempotency_key = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string idempotency_key = 4;
}

message AuthResponse {
  Session session = 2;
}

message LogoutRequest {
  string session_id = 1;
  string idempotency_key = 2;
}

message CheckSessionRequest {
  string session_id = 1;
}

message CSRFRequest {
  string session_id = 1;
  string idempotency_key = 2;
}

message CSRFResponse {
  string token = 1;
}
