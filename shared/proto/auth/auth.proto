syntax = "proto3";

package auth;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/auth";

// Сервис
service AuthService {
  // Метод для регистрации
  rpc Register (RegisterRequest) returns (AuthResponse);
  // Метод для входа в аккаунт
  rpc Login (RegisterRequest) returns (AuthResponse);
  // Метод для выхода из аккаунты
  rpc Logout (RegisterRequest) returns (LogoutResponse);
  // Метод для проверки сессии
  rpc CheckSession (CheckSessionRequest) returns (CheckSessionResponse);
  // Метод для получения CSRF токена
  rpc GetCSRF (CSRFRequest) returns (CSRFResponse);
  // Метод для создания CSRF токена
  rpc SetCSRF (CSRFRequest) returns (CSRFResponse);
}


message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string user_role = 4;
  string avatar_url = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Session {
  string id = 1;
  int64 user_id = 2;
  string user_agent = 3;
  google.protobuf.Timestamp expires_at = 4;
}


message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string user_agent = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
}

message AuthResponse {
  User user = 1;
  Session session = 2;
}

message LogoutRequest {
  string session_id = 1;
}

message LogoutResponse {
  
}

message CheckSessionRequest {
  string session_id = 1;
}

message CheckSessionResponse {
  User user = 1;
}

message CSRFRequest {
  string session_id = 1;
}

message CSRFResponse {
  string token = 1;
}
