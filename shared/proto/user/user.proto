syntax = "proto3";

package user;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/user";

// Микросервис пользователей
service UserService {
  // Метод создания базового пользователя
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  // Создание профиля клиента
  rpc CreateClientProfile (CreateClientProfileRequest) returns (google.protobuf.Empty);
  // Метод обновления данных профиля пользователя
  rpc UpdateProfile (UpdateProfileRequest) returns (google.protobuf.Empty);
  // Метод загрузки аватарки
  rpc UpdateAvatar (UpdateAvatarRequest) returns (UpdateAvatarResponse);
  // Метод удаления аватарки (Сброс на дефолтную)
  rpc DeleteAvatar (DeleteAvatarRequest) returns (DeleteAvatarResponse);
  // Метод получения пользователя по его ID
  rpc GetByID (GetUserByIDRequest) returns (GetUserResponse);
  // Метод получения пользователя по его почте
  rpc GetByEmail (GetUserByEmailRequest) returns (GetUserResponse);
  // Метод проверка пользователя на существование
  rpc CheckUserExists (CheckUserExistsRequest) returns (CheckUserExistsResponse);
  // Метод получения данных для профиля юзера
  rpc GetUserProfile (GetUserProfileRequest) returns (GetUserProfileResponse);
  // Метод смены роли пользователя
  rpc UpdateUserRole (UpdateUserRoleRequest) returns (google.protobuf.Empty);
  // Получить пользователей пачкой
  rpc GetUsersByIDs (GetUsersByIDsRequest) returns (GetUsersByIDsResponse);
  // Обратный поиск внутреннего ID по публичному
  rpc ResolvePublicID (ResolvePublicIDRequest) returns (ResolvePublicIDResponse);
  // Хук, который order-service дёргает при переходе заказа в paid.
  // Обновляет стрик и прогресс ачивок пользователя.
  rpc OnOrderPaid (OnOrderPaidRequest) returns (google.protobuf.Empty);
  // Возвращает все ачивки системы.
  rpc ListAchievements (google.protobuf.Empty) returns (ListAchievementsResponse);
  // Возвращает ачивки текущего пользователя (только полученные).
  rpc GetUserAchievements (GetUserAchievementsRequest) returns (GetUserAchievementsResponse);
  // Метод для активации заморозки серии заказов (streak freeze)
  rpc ActivateStreakFreeze (ActivateStreakFreezeRequest) returns (google.protobuf.Empty);
  // Метод для начисления стрик-буста (+1 неделя к серии)
  rpc IncrementStreak (IncrementStreakRequest) returns (google.protobuf.Empty);
  // Метод-хук, вызываемый при любой прокрутке колеса
  rpc OnWheelSpin (OnWheelSpinRequest) returns (google.protobuf.Empty);
  // Метод проверки кулдауна и резервирования попытки прокрутки колеса
  rpc ClaimWheelSpin (ClaimWheelSpinRequest) returns (google.protobuf.Empty);
  // Сброс кулдауна колеса (при выпадении реролла)
  rpc ResetWheelSpinCooldown (ResetWheelSpinCooldownRequest) returns (google.protobuf.Empty);
}


message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string avatar_url = 5;
  string password_hash = 6;
  string public_id = 7;
}

message ClientProfile {
  int64 account_id = 1;
  int64 bonus_balance = 2;
  optional int64 bonus_category_id = 3;
  google.protobuf.Timestamp bonus_category_expires_at = 4;
  google.protobuf.Timestamp bonus_expires_at = 5;
  int32 streak_count = 6;
  google.protobuf.Timestamp last_order_date = 7;
  google.protobuf.Timestamp premium_expires_at = 8;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string idempotency_key = 4;
}

message CreateUserResponse {
  int64 user_id = 1;
}

message CreateClientProfileRequest {
  int64 user_id = 1;
  string idempotency_key = 2;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  optional string name = 2;
  optional string email = 3;
  string idempotency_key = 4;
}

message UpdateAvatarRequest {
  int64 user_id = 1;
  bytes image_data = 2;
  string idempotency_key = 3;
}

message UpdateAvatarResponse {
  string avatar_url = 1;
}

message DeleteAvatarRequest {
  int64 user_id = 1;
  string idempotency_key = 2;
}

message DeleteAvatarResponse {
  string default_avatar_url = 1;
}

message GetUserByIDRequest {
  int64 user_id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserResponse {
  User user = 1;
}

message CheckUserExistsRequest {
  int64 user_id = 1;
}

message CheckUserExistsResponse {
  bool exists = 1;
}

message GetUserProfileRequest {
  int64 user_id = 1;
}

message GetUserProfileResponse {
  User user = 1;
  ClientProfile profile = 2;
}

message UpdateUserRoleRequest {
  int64 user_id = 1;
  string new_role = 2;
  string idempotency_key = 3;
}

message GetUsersByIDsRequest {
  repeated int64 user_ids = 1;
}

message GetUsersByIDsResponse {
  map<int64, User> users = 1;
}

message ResolvePublicIDRequest {
  string public_id = 1;
}

message ResolvePublicIDResponse {
  int64 user_id = 1;
}

message OnOrderPaidRequest {
  int64 user_id = 1;
  string order_public_id = 2;
  int64 restaurant_id = 3;
  google.protobuf.Timestamp paid_at = 4;
}

message Achievement {
  int64 id = 1;
  string code = 2;
  string title = 3;
  string description = 4;
  string icon = 5;
  int32 sort_order = 6;
}

message ListAchievementsResponse {
  repeated Achievement achievements = 1;
}

message GetUserAchievementsRequest {
  int64 user_id = 1;
}

message UserAchievement {
  int64 achievement_id = 1;
  google.protobuf.Timestamp awarded_at = 2;
}

message GetUserAchievementsResponse {
  repeated UserAchievement achievements = 1;
}

message ActivateStreakFreezeRequest {
  int64 user_id = 1;
}

message IncrementStreakRequest {
  int64 user_id = 1;
}

message OnWheelSpinRequest {
  int64 user_id = 1;
  optional string won_achievement_code = 2;
}

message ClaimWheelSpinRequest {
  int64 user_id = 1;
}

message ResetWheelSpinCooldownRequest {
  int64 user_id = 1;
}