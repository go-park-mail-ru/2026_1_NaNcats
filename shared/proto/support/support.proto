syntax = "proto3";

package support;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/support";

// Микросервис техподдержки
service SupportService {
  // Метод создания тикета
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  // Метод отправки сообщения
  rpc SendMessage(SendMessageRequest) returns (EventResponse);
  // Метод получения тикетов юзера
  rpc GetUserTickets(GetUserTicketsRequest) returns (TicketListResponse);
  // Метод получения эвента
  rpc GetTicketEvents(GetTicketEventsRequest) returns (EventListResponse);
  // Метод оценки тикета
  rpc RateTicket(RateTicketRequest) returns (SuccessResponse);

  // Метод получения связанных тикетов
  rpc GetAssignedTickets(GetAssignedTicketsRequest) returns (TicketListResponse);
  // Метод изменения статуса тикета
  rpc ChangeTicketStatus(ChangeTicketStatusRequest) returns (SuccessResponse);
  // Метод передачи тикета другому
  rpc ReassignTicket(ReassignTicketRequest) returns (SuccessResponse);
  // Метод 
  rpc SetAgentStatus(SetAgentStatusRequest) returns (SuccessResponse);

  // Метод получения категорий обращенийы
  rpc GetCategories(google.protobuf.Empty) returns (CategoryListResponse);
  // Метод получения шаблонных ответов
  rpc GetTemplates(google.protobuf.Empty) returns (TemplateListResponse);
  // Метод получения статистики
  rpc GetStats (google.protobuf.Empty) returns (SupportStatsResponse);
}

message TicketResponse {
  int64 id = 1;
  string public_id = 2;
  int64 category_id = 3;
  string current_status = 4;
  int64 support_line = 5;
  int64 assignee_id = 6;
  int32 resolution_rating = 7;
  google.protobuf.Timestamp created_at = 8;
}

message SupportStatsResponse {
  int64 total_tickets = 1;
  map<string, int64> by_status = 2;   // "open": 10, "closed": 50
  map<string, int64> by_category = 3; // "баг": 15, "жалоба": 5
  double average_rating = 4;          // 4.5
  int64 avg_resolution_time_sec = 5;  // среднее время закрытия
}

message Event {
  int64 id = 1;
  int64 ticket_id = 2;
  int64 author_id = 3;
  string author_role = 4;
  string event_type = 5;
  string payload = 6; // JSON строка (содержимое зависит от event_type)
  google.protobuf.Timestamp created_at = 7;
}

// --- Запросы и ответы ---

message SuccessResponse {
  bool success = 1;
}

message CreateTicketRequest {
  int64 client_id = 1; // 0, если гость
  string guest_id = 2;
  string contact_email = 3;
  int64 category_id = 4;
  string initial_message = 5;
  string client_meta = 6; // JSON строка
  string idempotency_key = 7;
}

message CreateTicketResponse {
  string public_id = 1;
}

message SendMessageRequest {
  string ticket_public_id = 1;
  int64 author_id = 2;
  string author_role = 3;
  string message = 4;
  string idempotency_key = 5;
}

message EventResponse {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message GetUserTicketsRequest {
  int64 client_id = 1;
  string guest_id = 2;
}

message GetTicketEventsRequest {
  string ticket_public_id = 1;
  int64 client_id = 2; // Для проверки прав доступа к тикету
  string guest_id = 3;
}

message TicketListResponse {
  repeated TicketResponse tickets = 1;
}

message EventListResponse {
  repeated Event events = 1;
}

message RateTicketRequest {
  string ticket_public_id = 1;
  int32 rating = 2;
  int64 client_id = 3;
  string idempotency_key = 4;
}

message GetAssignedTicketsRequest {
  int64 agent_id = 1;
}

message ChangeTicketStatusRequest {
  string ticket_public_id = 1;
  string status = 2;
  int64 agent_id = 3;
  string idempotency_key = 4;
}

message ReassignTicketRequest {
  string ticket_public_id = 1;
  int64 agent_id = 2; // Кому передаем
  int32 line = 3; // На какую линию
  int64 author_id = 4;
  string idempotency_key = 5;
}

message SetAgentStatusRequest {
  int64 agent_id = 1;
  string status = 2; // online / offline
}

message Category {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int32 default_line = 4;
}

message CategoryListResponse {
  repeated Category categories = 1;
}

message Template {
  int64 id = 1;
  string name = 2;
  string content = 3;
}

message TemplateListResponse {
  repeated Template templates = 1;
}
