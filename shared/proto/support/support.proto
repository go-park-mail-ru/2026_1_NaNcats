syntax = "proto3";

package support;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/support";

// Микросервис тех поддержки
service SupportService {
  // Метод создания тикета
  rpc CreateTicket(CreateTicketRequest) returns (TicketResponse);
  // Метод отправки сообщения
  rpc SendMessage(SendMessageRequest) returns (MessageResponse);
  // Метод получения тикетов конкретного юзера
  rpc GetUserTickets(GetUserTicketsRequest) returns (TicketListResponse);
  // Получение сообщений тикета
  rpc GetTicketMessages(GetTicketMessagesRequest) returns (MessageListResponse);
}

message CreateTicketRequest {
  int64 client_id = 1; // 0, если гость
  string guest_id = 2;
  string contact_email = 3;
  string category = 4;
  string initial_message = 5;
  string client_meta = 6;
}

message SendMessageRequest {
  int64 ticket_id = 1;
  int64 author_id = 2;
  string author_role = 3;
  string message = 4;
}

message Message {
  int64 id = 1;
  int64 ticket_id = 2;
  int64 author_id = 3;
  string author_role = 4;
  string text = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetUserTicketsRequest {
  int64 client_id = 1;
  string guest_id = 2;
}

message GetTicketMessagesRequest {
  int64 ticket_id = 1;
}

message TicketResponse {
  int64 id = 1;
  string public_id = 2;
  string current_status = 3;
  google.protobuf.Timestamp created_at = 4;
}

message MessageResponse {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message TicketListResponse {
  repeated TicketResponse tickets = 1;
}

message MessageListResponse {
  repeated Message messages = 1;
}
