syntax = "proto3";

package order;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/order";

// Микросервис управления заказами
service OrderService {
  // Метод создания нового заказа
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  // Метод получения истории заказов пользователя
  rpc GetOrders (GetOrdersRequest) returns (GetOrdersResponse);
  // Метод смены статус заказа
  rpc UpdateOrderStatusByPaymentID (UpdateStatusRequest) returns (google.protobuf.Empty);
  // Метод для оплаты счета за друга
  rpc PayForFriend (PayForFriendRequest) returns (google.protobuf.Empty);
  // Метод для отмены заказа
  rpc CancelOrder (CancelOrderRequest) returns (google.protobuf.Empty);
}

// Сервис промокодов. Промокоды хранятся в БД OrderService, поэтому
// вся работа с ними реализована здесь, а api-gateway ходит сюда по gRPC.
service PromoService {
  // Промокоды, привязанные к пользователю
  rpc GetUserPromos (GetUserPromosRequest) returns (PromocodeList);
  // Действующие промокоды ресторана
  rpc GetRestaurantPromos (GetRestaurantPromosRequest) returns (PromocodeList);
  // Привязка промокода к пользователю по коду
  rpc BindPromocode (BindPromocodeRequest) returns (Promocode);
  // Проверка промокода для заказа и расчёт скидки
  rpc ValidatePromocode (ValidatePromocodeRequest) returns (ValidatePromocodeResponse);
  // Фиксация использования промокода после оформления заказа
  rpc UsePromocode (UsePromocodeRequest) returns (google.protobuf.Empty);
}

message CancelOrderRequest {
  string order_public_id = 1;
  int64 user_id = 2;
}

message OrderDish {
  int64 dish_id = 1;
  string dish_name = 2;
  int32 quantity = 3;
  int64 price = 4;
  optional int64 owner_user_id = 5;
}

message OrderSplit {
  string split_id = 1;
  int64 user_id = 2;
  int64 amount = 3;
  string status = 4;
  int64 base_amount = 5;
  int64 discount_amount = 6;
}

message Order {
  string public_id = 1;
  string restaurant_name = 2;
  string restaurant_logo_url = 3;
  int64 total_cost = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated OrderDish items = 7;
  repeated OrderSplit splits = 8;
  int64 restaurant_brand_id = 9;
  optional string applied_promocode = 10;
  int64 discount_amount = 11;
}

message CreateOrderRequest {
  int64 user_id = 1;
  string address_public_id = 2;
  int64 restaurant_branch_id = 3;
  int64 restaurant_brand_id = 4;
  
  string payment_method_id = 5; 
  bool pay_for_all = 6; 
  map<int64, int64> payer_mapping = 7;
  
  int64 delivery_cost = 8;
  int64 service_fee = 9;
  string idempotency_key = 10;

  optional string promocode = 11;
}

message CreateOrderResponse {
  string order_public_id = 1;
}

message GetOrdersRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetOrdersResponse {
  repeated Order orders = 1;
}

message UpdateStatusRequest {
  string yookassa_payment_id = 1;
  string status = 2;
  string idempotency_key = 3;
}

message PayForFriendRequest {
  string split_id = 1;
  int64 payer_user_id = 2;
  string payment_method_id = 3;
  string idempotency_key = 4;
}

// --- Промокоды ---

message Promocode {
  int64 id = 1;
  string code = 2;
  string title = 3;
  optional int32 discount_percent = 4;
  optional int64 discount_amount = 5;
  int64 min_order_amount = 6;
  optional string expires_at = 7;
  repeated int64 restaurant_brand_ids = 8;
}

message PromocodeList {
  repeated Promocode promocodes = 1;
}

message GetUserPromosRequest {
  int64 user_id = 1;
}

message GetRestaurantPromosRequest {
  int64 restaurant_brand_id = 1;
}

message BindPromocodeRequest {
  int64 user_id = 1;
  string code = 2;
}

message ValidatePromocodeRequest {
  int64 user_id = 1;
  string code = 2;
  int64 restaurant_brand_id = 3;
  int64 order_amount = 4;
  int64 delivery_cost = 5;
  int64 service_fee = 6;
}

message ValidatePromocodeResponse {
  bool valid = 1;
  int64 discount = 2;
  string reason = 3;
}

message UsePromocodeRequest {
  int64 user_id = 1;
  string code = 2;
  string order_public_id = 3;
}
