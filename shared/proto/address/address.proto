syntax = "proto3";

package address;

import "google/protobuf/empty.proto";

option go_package = "github.com/go-park-mail-ru/2026_1_NaNcats/shared/proto/address";

// Сервис работы с адресами
service AddressService {
  // Метод добавления адреса пользователя
  rpc AddAddress (AddAddressRequest) returns (AddAddressResponse);
  // Метод получения адресов пользователя
  rpc GetMyAddresses (GetMyAddressesRequest) returns (GetMyAddressesResponse);
  // Метод удаления адреса пользователя
  rpc DeleteAddress (DeleteAddressRequest) returns (google.protobuf.Empty);
  // Метод изменения адреса
  rpc UpdateAddress (UpdateAddressRequest) returns (google.protobuf.Empty);
}


message Location {
  string address_text = 1;
  double latitude = 2;
  double longitude = 3;
}

message Address {
  string public_id = 1;
  Location location = 2;
  string apartment = 3;
  string entrance = 4;
  string floor = 5;
  string door_code = 6;
  string courier_comment = 7;
  string label = 8;
}

message AddAddressRequest {
  int64 user_id = 1;
  Address address = 2;
  string idempotency_key = 3;
}

message AddAddressResponse {
  string address_public_id = 1;
}

message GetMyAddressesRequest {
  int64 user_id = 1;
}

message GetMyAddressesResponse {
  repeated Address addresses = 1;
}

message DeleteAddressRequest {
  int64 user_id = 1;
  string address_public_id = 2;
  string idempotency_key = 3;
}

message UpdateAddressRequest {
  int64 user_id = 1;
  Address address = 2;
  string idempotency_key = 3;
}
