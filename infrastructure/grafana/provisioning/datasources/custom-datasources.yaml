apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-datasources
  namespace: default
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus:9090
        isDefault: true
        editable: false

      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger-query:16686
        access: proxy
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
      
      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: '"trace_id": "(\w+)"'
              name: TraceID
              url: "$${__value.raw}"