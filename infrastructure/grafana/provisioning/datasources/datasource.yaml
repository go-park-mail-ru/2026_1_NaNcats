apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    access: proxy
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
  
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    editable: false
    jsonData:
      # Позволяет быстро переходить от логов к трейсам, если в логе есть trace_id
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id": "(\w+)"'
          name: TraceID
          url: "$${__value.raw}"