apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-initdb
data:
  init-db.sql: |
    CREATE DATABASE IF NOT EXISTS analytics;

    USE analytics;

    CREATE TABLE IF NOT EXISTS analytics.schema_migrations (
        version Int64,
        dirty UInt8,
        sequence UInt64
    ) ENGINE = MergeTree()
    ORDER BY version;

    CREATE TABLE IF NOT EXISTS orders_report_log (
        event_time DateTime64(3, 'Europe/Moscow'),
        event_date Date DEFAULT toDate(event_time),

        order_public_id UUID,
        restaurant_id Int64,
        client_id Int64,

        total_cost_raw Int64,
        delivery_cost_raw Int64,
        service_fee_raw Int64,
        discount_raw Int64,
        restaurant_revenue_raw Int64,

        status String,
        prev_status String,

        order_type String,
        members_count Int32,
        city String DEFAULT 'undefined',

        is_financial_impact Int8 DEFAULT 0
    )
    ENGINE = ReplacingMergeTree(event_time)
    PARTITION BY toYYYYMM(event_date)
    ORDER BY (restaurant_id, order_public_id, status);

    CREATE TABLE IF NOT EXISTS order_items_report_log (
        event_time DateTime64(3, 'Europe/Moscow'),
        event_date Date DEFAULT toDate(event_time),

        order_public_id UUID,
        restaurant_id Int64,
        dish_id Int64,
        dish_name String,

        quantity Int32,
        price_raw Int64,
        row_total_raw Int64,

        user_id Int64
    )
    ENGINE = ReplacingMergeTree(event_time)
    PARTITION BY toYYYYMM(event_date)
    ORDER BY (restaurant_id, order_public_id, dish_id);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_DB
              value: analytics
            - name: CLICKHOUSE_USER
              value: admin
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nancats-prod-secrets
                  key: clickhouse-password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data
        - name: initdb
          configMap:
            name: clickhouse-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
