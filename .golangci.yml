version: "2"

run:
  timeout: 5m

linters:
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - "(net/http.ResponseWriter).Write"
        - "(io.Closer).Close"
        - "(*database/sql.Tx).Rollback"
        - "(github.com/jackc/pgx/v5.Tx).Rollback"

  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Error return value of `.*\\.(Close|Rollback|Write)` is not checked"
